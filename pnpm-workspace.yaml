packages:
  - examples/**
  - docs
  - client

catalog:
  nuxt: ^4.6.0
  vite-plugin-inspect: ^12.0.2

catalogs:
  vite-plus:
    'vite': npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
    'vite-plus': 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
    'vitest': 5.1.0
    '@vitest/ui': 5.1.0

ignoreWorkspaceRootCheck: true

overrides:
  vite@*: catalog:vite-plus
  vitest@*: catalog:vite-plus

shamefullyHoist: true
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  sharp: true
  vue-demi: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'

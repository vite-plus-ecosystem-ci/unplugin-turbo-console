packages:
  - examples/**
  - docs
  - client
catalog:
  nuxt: ^4.4.4
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158
  vite-plugin-inspect: ^11.3.3
  vite-plus: 0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158
  vitest: 5.0.3
  '@vitest/ui': 5.0.3

ignoreWorkspaceRootCheck: true
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
shamefullyHoist: true
onlyBuiltDependencies:
  - esbuild
  - '@sveltejs/kit'
  - sharp
  - vue-demi
  - svelte-preprocess

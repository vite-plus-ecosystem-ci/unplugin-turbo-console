packages:
  - examples/**
  - docs
  - client
catalog:
  nuxt: ^4.4.4
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.134033efc595ae5efab9df5c177a9ae20904a5d9
  vite-plugin-inspect: ^11.3.3
  vite-plus: 0.0.0-commit.134033efc595ae5efab9df5c177a9ae20904a5d9
  vitest: 5.0.1
  '@vitest/ui': 5.0.1

ignoreWorkspaceRootCheck: true
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
shamefullyHoist: true
onlyBuiltDependencies:
  - esbuild
  - '@sveltejs/kit'
  - sharp
  - vue-demi
  - svelte-preprocess

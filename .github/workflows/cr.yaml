name: CR

on:
  push:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'tests/**'
      - 'docs/**'
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts/*'
          cache: true

      - name: Build
        run: vp pack

      # Ecosystem-ci smoke test: publishing a preview package needs a GitHub App or
      # token the fork does not have, and it does not exercise the pinned Vite+.
      - name: Run vp dlx pkg-pr-new publish
        if: ${{ github.repository_owner != 'vite-plus-ecosystem-ci' }}
        run: vp dlx pkg-pr-new publish
